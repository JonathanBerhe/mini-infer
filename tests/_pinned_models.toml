# Pinned HuggingFace model revisions for bit-parity CI.
#
# Each entry maps a HF model id to the exact commit SHA we test against.
# Bit-parity tests in this repository compare mini-infer's output to the
# pinned reference at the specified SHA; an upstream change to the same
# model_name's main branch doesn't affect our tests until we update this
# manifest.
#
# To update: run `uv run python scripts/prefetch_pinned_models.py --refresh`
# which queries the current SHA for each model_name and prints the diff
# from this file. Bumping a pin is a deliberate action that should be
# accompanied by re-running the bit-parity suite locally to confirm
# tokens match at the new revision.
#
# The bit-parity CI workflow (.github/workflows/bitparity.yml) reads
# this file, downloads each model at its pinned SHA, and runs the
# requires_model-marked tests against those cached weights.

[[models]]
name = "Qwen/Qwen2.5-0.5B-Instruct"
revision = "7ae557604adf67be50417f59c2c2f167def9a775"
purpose = "Primary smoke / PD scheduler / spec dec / API tests"

[[models]]
name = "Qwen/Qwen3-0.6B"
revision = "c1899de289a04d12100db370d81485cdf75e47ca"
purpose = "Qwen3 family golden test (per-head Q/K norm)"

[[models]]
name = "HuggingFaceTB/SmolLM2-135M-Instruct"
