[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mini-infer"
version = "0.0.1"
description = "A pedagogical LLM inference engine."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "transformers>=4.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mini_infer"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/mini_infer"]

[[tool.mypy.overrides]]
module = ["transformers", "transformers.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a GPU",
    "slow: marked slow",
    "requires_model: requires downloading a real HF model (~1GB); runs locally, skipped in CI",
]
