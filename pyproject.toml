[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mini-infer"
version = "0.0.1"
description = "A pedagogical LLM inference engine."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "transformers>=4.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
# CUDA-only extras. Installed in Modal images and on machines with CUDA;
# omitted on M1 / CPU where flash-attn cannot build. Imports of `flash_attn`
# in the codebase MUST be try/except guarded so non-CUDA installs still work.
# 2.8+ is required for `flash_attn_varlen_func`'s `block_table` parameter
# (paged-aware varlen attention; lets the kernel read K/V directly from our
# `BlockPool` storage without per-layer materialization).
cuda = [
    "flash-attn>=2.8",
    # FlashInfer paged-attention kernels; CUDA-only, import-guarded.
    "flashinfer-python>=0.6.10rc1",
]
# TPU-only extra for the JAX/Pallas backend (src/mini_infer/backends/tpu).
# Plain `jax`, NOT `jax[tpu]`: plain JAX runs Pallas kernels in interpret mode
# on CPU (pallas_call(..., interpret=True)), which is enough to develop and
# parity-test the kernels with no TPU hardware. Imports of `jax` in the codebase
# are try/except guarded so the base (non-TPU) install still imports. Real TPU
# execution needs `jax[tpu]` installed separately on a TPU host.
tpu = [
    "jax>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mini_infer"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "modal>=1.4.2",
    # Bit-parity reference for MiniMax-M3: the minimax_m3_vl modeling code first
    # ships in transformers 5.12. Constrains the (single) resolved transformers
    # for the whole repo to 5.12.x; the golden suite is re-run to confirm the
    # existing families still match under the bump.
    "transformers>=5.12,<5.13",
    # async HTTP client for the open-loop bench (scripts/http_openloop_bench.py).
    # Streaming + per-token timing via SSE; not used by the server itself.
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Triton kernels conventionally use uppercase pointer args (Q_ptr) and constexpr
# constants (HEAD_DIM, BLOCK_SIZE). Allow it in the kernel modules.
"src/mini_infer/cache/paged_attention.py" = ["N803"]
"src/mini_infer/cache/msa_paged_attention.py" = ["N803"]
"src/mini_infer/cache/turbo_kernel.py" = ["N803"]
"src/mini_infer/quant/int8_kernel.py" = ["N803"]
"src/mini_infer/models/blocks/hc_sinkhorn_kernel.py" = ["N803"]
# `Depends(...)` in default args is the canonical FastAPI dependency-injection
# idiom; B008 flags it as a "function call in default", which is the point.
"src/mini_infer/api/server.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/mini_infer"]

[[tool.mypy.overrides]]
module = ["transformers", "transformers.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["triton", "triton.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["flash_attn", "flash_attn.*"]
ignore_missing_imports = true
follow_imports = "skip"

# JAX/Pallas is the optional TPU backend SDK (the `tpu` extra). Treated like
# triton/flash_attn: an import-guarded accelerator dependency whose kernel DSL
# (jax.experimental.pallas) we do not type-check against. Skipping it also lets
# the `jax = None` fallback bindings type-check on non-JAX installs.
[[tool.mypy.overrides]]
module = ["jax", "jax.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a GPU",
    "slow: marked slow",
    "requires_model: requires downloading a real HF model (~1GB); runs locally, skipped in CI",
    "requires_cuda: requires a CUDA GPU (e.g. for Triton kernels); skipped in CI and on MPS/CPU",
]
