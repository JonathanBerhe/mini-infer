[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mini-infer"
version = "0.0.1"
description = "A pedagogical LLM inference engine."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "transformers>=4.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
# CUDA-only extras. Installed in Modal images and on machines with CUDA;
# omitted on M1 / CPU where flash-attn cannot build. Imports of `flash_attn`
# in the codebase MUST be try/except guarded so non-CUDA installs still work.
# 2.8+ is required for `flash_attn_varlen_func`'s `block_table` parameter
# (paged-aware varlen attention; lets the kernel read K/V directly from our
# `BlockPool` storage without per-layer materialization).
cuda = [
    "flash-attn>=2.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mini_infer"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "modal>=1.4.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Triton kernels conventionally use uppercase pointer args (Q_ptr) and constexpr
# constants (HEAD_DIM, BLOCK_SIZE). Allow it in the kernel modules.
"src/mini_infer/cache/paged_attention.py" = ["N803"]
"src/mini_infer/cache/turbo_kernel.py" = ["N803"]
"src/mini_infer/quant/int8_kernel.py" = ["N803"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/mini_infer"]

[[tool.mypy.overrides]]
module = ["transformers", "transformers.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["triton", "triton.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["flash_attn", "flash_attn.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a GPU",
    "slow: marked slow",
    "requires_model: requires downloading a real HF model (~1GB); runs locally, skipped in CI",
    "requires_cuda: requires a CUDA GPU (e.g. for Triton kernels); skipped in CI and on MPS/CPU",
]
